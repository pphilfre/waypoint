name: iOS validation

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios-*.yml"
      - "convex/**"
  pull_request:
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios-*.yml"
      - "convex/**"

permissions:
  contents: read

concurrency:
  group: ios-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode and generate project
        run: bash apps/ios/scripts/setup-ci.sh

      - name: Resolve pinned dependencies
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project apps/ios/Waypoint.xcodeproj \
            -scheme Waypoint \
            -clonedSourcePackagesDirPath apps/ios/build/SourcePackages

      - name: Choose available iPhone simulator
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/devices.json"

          python3 - <<'PY'
          import json
          import os

          with open(os.environ["RUNNER_TEMP"] + "/devices.json") as f:
              runtimes = json.load(f)["devices"]

          devices = []

          for runtime, rows in runtimes.items():
              if "iOS" not in runtime:
                  continue

              for device in rows:
                  if (
                      device.get("isAvailable", False)
                      and device.get("name", "").startswith("iPhone")
                  ):
                      devices.append((runtime, device))

          if not devices:
              print("Available simulator runtimes:")
              for runtime, rows in runtimes.items():
                  print(runtime)
                  for device in rows:
                      print(
                          "  ",
                          device.get("name"),
                          device.get("udid"),
                          "available=" + str(device.get("isAvailable"))
                      )

              raise SystemExit("No available iPhone simulator found")

          runtime, device = devices[0]

          print(f"Using simulator: {device['name']}")
          print(f"Runtime: {runtime}")
          print(f"UDID: {device['udid']}")

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"SIMULATOR_ID={device['udid']}\n")
          PY

      - name: Build and test native application
        run: |
          set -o pipefail

          mkdir -p apps/ios/build

          xcodebuild test \
            -project apps/ios/Waypoint.xcodeproj \
            -scheme Waypoint \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath apps/ios/build/DerivedData \
            -clonedSourcePackagesDirPath apps/ios/build/SourcePackages \
            -resultBundlePath apps/ios/build/Validation.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee apps/ios/build/validation.log

      - name: Upload compiler log and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-validation-${{ github.run_number }}
          path: |
            apps/ios/build/validation.log
            apps/ios/build/Validation.xcresult
          if-no-files-found: warn
          retention-days: 14
